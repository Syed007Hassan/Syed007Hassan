name: Update README stats cards

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      # Add a repo secret STATS_TOKEN (classic PAT with `repo` + `read:user`) to include
      # private-repo stats; without it, falls back to GITHUB_TOKEN (public repos only).
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=algolia&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=algolia&card_width=400&hide=tex,c%2B%2B,html
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # Most-used + recently-used languages (lowlighter/metrics). Requires a PAT;
      # skipped until the STATS_TOKEN secret exists.
      - name: Generate languages card (metrics)
        if: env.STATS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          filename: metrics-languages.svg
          output_action: none
          debug: yes # temporary: verbose logs to diagnose empty languages sections
          base: ""
          # Commits are matched by author name/email. The email comes from the optional
          # COMMIT_EMAIL secret so it isn't hardcoded in this public file.
          commits_authoring: Syed007Hassan, Syed Muhammed Hassan Ali, ${{ secrets.COMMIT_EMAIL }}
          config_timezone: Europe/Berlin
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, sass, tex, c++, dockerfile, makefile, shell

      - name: Copy metrics render
        if: env.STATS_TOKEN != ''
        run: cp /metrics_renders/metrics-languages.svg profile/metrics-languages.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
